[pytest]
markers =
    requires_local_corpus: requires gitignored Tantular corpus artifacts unavailable in CI
    requires_addin: requires the Office add-in source, which is not on any published ref

# NO automatic skipping is configured, deliberately. A marked test still RUNS
# and still FAILS when the corpus is absent, because a check that cannot run
# must refuse rather than pass — the same rule the gates themselves follow.
# Deselecting the marker is a CI workflow policy (`-m "not requires_local_corpus"`),
# visible in .github/workflows/tests.yml, not a runtime decision. See docs/CI.md.

# requires_addin exists for the same reason and works the same way. The add-in
# the gates run against (../tantular_office_addin, in ghifiardi/LLM-Indonesia)
# is not on that repository's default branch, and its package-lock.json is not
# tracked on any ref, so CI cannot obtain the tree the gates were verified
# against. CI deselects these explicitly; locally they still RUN and still FAIL
# when the add-in is absent.
