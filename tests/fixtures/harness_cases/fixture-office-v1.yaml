# FIXTURE case set -- NOT an approved product evaluation set.
#
# Every outcome below is DECLARED, not observed. FakeOfficeExecutor replays
# these rows so the controller, the receipt schema, the approval and budget
# gates and the aggregation arithmetic can be tested without an Office
# adapter, a model or a network. `approved: false` and `split: fixture` are
# what stop src/harness_eval.py from aggregating a replay into anything that
# reads as a product measurement.
#
# The declared shape is deliberately the interesting one: the candidate
# harness helps the student (0.6 -> 0.8) but not enough to reach the 0.90
# target, while the teacher is already at 1.0 under both harnesses. That
# leaves a residual model gap and a NEGATIVE interaction -- the fourth arm
# earning its place.
