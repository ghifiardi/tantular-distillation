# A single 48GB Ada card — RTX 6000 Ada (~$0.74/hr) or L40S (~$0.79/hr) on
# RunPod community cloud.
#
# Preferred over ai19 when a run needs to finish fast: same 48GB, but on ONE
# card, so there is no tensor-parallel hop over PCIe. FP8 is native.
#
# Do NOT substitute an RTX A6000 because it is cheaper ($0.33/hr). The A6000
# is Ampere and cannot do FP8 — it would silently force int4 and degrade every
# trace the teacher produces.

# Data handling: OFF-PREMISES, third-party hardware. Real Office source
# material must not go here without explicit per-kind egress approval
# (inventory/sources.yaml: egress_approved).
data_egress: external

name: rented-48gb
gpu: "1x RTX 6000 Ada / L40S 48GB"
tensor_parallel_size: 1
quantization: fp8
gpu_memory_utilization: 0.92
max_model_len: 32768

# generate_normalized.py requires an explicit endpoint; preflight can build one
# from the port but generation cannot. Absent until a 2026-08-18 rental became
# the first run to actually generate against this host.
base_url: http://localhost:8010/v1

# The v1 QLoRA run happens on a rental, not on ai19. Declared explicitly
# because src/config.py: training_guard() refuses any host that is silent.
training_allowed: true
