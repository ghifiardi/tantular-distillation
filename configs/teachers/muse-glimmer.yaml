# Muse Glimmer 30B (Meta) — dense, Apache 2.0.
#
# The model card places no restriction on training other models from its
# outputs, which is what makes it usable as a distillation teacher at all.
# Re-check the card before a commercial run; licenses get amended.
#
# Dense 30B: ~60GB at BF16, ~32GB at FP8, ~17GB at int4.
# Strengths to draw on: long-context document reasoning, multimodal/document
# understanding, tool-call schemas. Do NOT use it to teach Indonesian —
# that capability is Tantular's own and distilling over it loses ground.

name: muse-glimmer
port: 8001
served_model_name: muse-glimmer
license: apache-2.0

repos:
  fp8: RedHatAI/Muse-Glimmer-30B-FP8-block
  bf16: meta-models/Muse-Glimmer-30B-assistant
  int4: mlx-community/Muse-Glimmer-30B-4bit   # Metal only, validation scale

# NVFP4 builds exist (RedHatAI/Muse-Glimmer-30B-NVFP4) but require Blackwell.
# Neither ai19 nor a 48GB Ada rental can load them.

sampling:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2048
