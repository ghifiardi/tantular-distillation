# QLoRA: Qwen3.5 9B student, single 24GB card (a 4090 on ai19, or rented).
#
# This produces the FIRST genuinely fine-tuned tantular-office model. Today's
# tantular-office:0.4-9b is a runtime profile — Modelfile.office-9b is
# `FROM qwen3.5:9b` plus a SYSTEM prompt, with no trained weights. There is no
# earlier Office checkpoint to continue from, so this run starts at base.
#
# Full fine-tuning a 9B does not fit 24GB. LoRA over a 4-bit base does, with
# room for a 32k sequence.

base_model: Qwen/Qwen3.5-9B
load_in_4bit: true
max_seq_length: 32768

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # Attention + MLP projections. Attention-only converges faster but retains
  # less of the structured-output behaviour the Studio features depend on.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  gradient_checkpointing: true
  bf16: true
  logging_steps: 10
  save_steps: 200

data:
  train: data/promoted/train.jsonl
  eval: data/promoted/eval.jsonl

# GATE EVERY RUN ON THIS. Distillation reliably buys reasoning while quietly
# costing Indonesian voice and JSON-contract adherence — and the Studio
# features break outright when the edit contract drifts. Run before and after,
# compare, and do not promote an adapter that regresses either.
eval_gates:
  - name: office_json_contract
    source: ../tantular_office_addin/tests
    min_pass_rate: 0.98
    model_dependent: false
    # MEASURED 2026-08-19, not assumed: this runs the add-in's own JS suite
    # (382 tests) with globalThis.fetch MOCKED. It never calls a model, so it
    # returns the SAME result before and after and CANNOT detect an adapter
    # regression. Retained as a genuine BUILD-HEALTH check — if the add-in's own
    # code breaks, that matters — but its "same" is never evidence the adapter
    # preserved the edit contract. That job belongs to edit_contract_output.

  - name: edit_contract_output
    source: prompts/edit_contract_eval.v1.jsonl
    checker: scripts/check_edit_contract.mjs
    addin_src: ../tantular_office_addin/src   # the REAL parser, not a copy
    items: 20
    min_pass_rate: 0.90
    model_dependent: true
    # The model-dependent half the config always intended by "edit-contract shape
    # must still parse". Generates edit answers from the model under test and
    # pushes them through the add-in's own parseEditContract / resolveEdits /
    # applyEditsToText.
    #
    # The rate is contract_ok — parsed AND located AND applied. parse_ok alone
    # would be too weak: valid JSON whose `find` appears nowhere in the document
    # parses cleanly and is useless. parse_ok and fields_ok are reported
    # alongside so a regression can be localised.
    #
    # Prompts are held out: laboratory, warehouse, publication, security, canteen
    # — disjoint from the training corpus and from the voice eval. The system
    # prompt is pulled from the add-in's EDIT_SYSTEM_PROMPT so it cannot drift
    # from what the product actually sends.
  - name: indonesian_voice
    # Wired 2026-08-19. The previous source (../tantular/data/eval) never existed:
    # tantular/data/ is gitignored, and the commit cited (55d10e8) actually added
    # eval_sets/id_factual_calibration.jsonl — 5 items measuring FACTUAL
    # CALIBRATION, not voice, and too few for a 0.95 threshold where one failure
    # scores 0.80. It was not repointed here; that would report one property while
    # measuring another.
    source: prompts/voice_eval.v1.jsonl
    scorer: src/score_voice.py               # rubric v2, approved 2026-08-19
    manifest: calibration/VOICE_EVAL_MANIFEST.v2.json
    items: 40
    min_pass_rate: 0.95                      # 38/40; verified 38 PASS, 37 FAIL
    model_dependent: true
    # THIS GATE DOES NOT TEST FAITHFULNESS. A fabricated figure written in fluent
    # professional Indonesian passes it. Faithfulness belongs to the mechanical
    # checks in calibrate.py and to office_json_contract above.
    # Known limitations, accepted for v1 and not grounds for loosening the gate:
    #   - audience coverage is 5 of 40 items;
    #   - items and rubric were drafted and reviewed by the same author.

output:
  adapter_dir: adapters/tantular-office-9b-v2
  # Merge + quantize to GGUF for Ollama, then rebuild Modelfile.office-9b to
  # point at the merged weights instead of stock qwen3.5:9b.
  export_gguf: true
  quantization: q4_k_m
